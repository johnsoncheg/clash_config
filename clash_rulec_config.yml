port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
bind-address: "*"
mode: Rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: true

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "network-test.debian.org"
    - "+.market.xiaomi.com"

  # 仅用于解析 DNS 服务器本身的域名
  # 官方文档说明这里必须是 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 常规域名解析：优先国内加密 DNS
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 代理节点域名解析：单独走国外加密 DNS
  # 避免节点域名暴露给本地明文 DNS
  proxy-server-nameserver:
    - tls://1.1.1.1:853
    - tls://8.8.4.4:853

  # 按域名类别分流 DNS
  nameserver-policy:
    "geosite:google":
      - https://dns.google/dns-query
      - https://1.1.1.1/dns-query
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - tls://1.1.1.1:853
      - tls://8.8.4.4:853

  # 后备 DNS：只放国外加密 DNS，不放 8.8.8.8 / 1.1.1.1 这种明文地址
  fallback:
    - tls://1.1.1.1:853
    - tls://8.8.4.4:853
    - https://dns.google/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.googleapis.com"
      - "+.gstatic.com"
      - "+.youtube.com"
      - "+.facebook.com"
      - "+.twitter.com"
      - "+.x.com"
      - "+.telegram.org"
